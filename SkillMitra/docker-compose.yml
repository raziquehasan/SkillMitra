services:
  # ──────────────────────────────────────────
  # Backend — FastAPI
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillmitra-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    env_file:
      - .env
    # Option 1: Use reload with specific directory (current)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --reload-dir /app
    # Option 2: Disable reload for stability (uncomment below, comment above)
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  # ──────────────────────────────────────────
  # Frontend — Next.js
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_DEMO_MODE=true
    depends_on:
      - backend
    restart: unless-stopped


